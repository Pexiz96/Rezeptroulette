<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b35">
  <meta name="description" content="Rezeptroulette hilft dir, Rezepte zu entdecken, Wochen zu planen und Lebensmittel sinnvoll zu verwerten.">
  <meta name="robots" content="index,follow">
  <title>Rezeptroulette – Was essen wir heute?</title>
  <link rel="manifest" href="/static/manifest.json">
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#fff3e7;--surface:#fffaf5;--surface-2:#fff0e3;--text:#2d1b12;--muted:#7c4a2d;
      --line:rgba(90,40,15,.12);--brand:#ff6b35;--brand-2:#ff9f1c;--green:#22a05a;--red:#dc2626;
      --shadow:0 18px 50px rgba(90,40,15,.12);--soft:0 8px 24px rgba(90,40,15,.08);
      --radius:22px;--radius-sm:14px;--max:1240px
    }
    body.dark{
      --bg:#120b08;--surface:#24140d;--surface-2:#3a2115;--text:#fff7ed;--muted:#d8b49c;
      --line:rgba(255,255,255,.10);--shadow:0 18px 50px rgba(0,0,0,.34);--soft:0 8px 24px rgba(0,0,0,.25)
    }

    body.dark .topbar{background:rgba(45,27,18,.88);border-bottom-color:rgba(255,255,255,.08)}
    body.dark .nav-btn:hover,body.dark .nav-btn.active{background:#3a2115;color:#ff9f1c}
    body.dark .secondary-btn,body.dark .icon-btn{background:#3a2115;color:#fff7ed;border-color:rgba(255,255,255,.10)}
    body.dark input,body.dark select,body.dark textarea{background:#1a0f0a;color:#fff7ed}

    html{scroll-behavior:smooth;background:var(--bg)}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:linear-gradient(135deg,#fff8f0,#ffe3d1);
      color:var(--text);
      line-height:1.5
    }
    body.dark{background:linear-gradient(135deg,#120b08,#2d1b12)}
    button,input,select,textarea{font:inherit}
    button{border:0;cursor:pointer}
    img{max-width:100%;display:block}
    a{color:inherit}
    .hidden{display:none!important}
    .app-shell{min-height:100vh}
    .topbar{position:sticky;top:0;z-index:1000;background:rgba(255,247,237,.92);backdrop-filter:blur(22px);border-bottom:1px solid rgba(90,40,15,.10)}
    .topbar-inner{max-width:var(--max);margin:auto;min-height:72px;padding:10px 18px;display:flex;align-items:center;gap:18px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;white-space:nowrap}
    .brand img{width:42px;height:42px;border-radius:14px;object-fit:cover;background:var(--surface-2)}
    .brand span{font-size:20px}
    .nav{display:flex;align-items:center;gap:4px;margin-left:auto}
    .nav-btn,.icon-btn,.ghost-btn,.secondary-btn,.primary-btn,.danger-btn{
      border-radius:13px;padding:11px 14px;font-weight:760;transition:.18s ease
    }
    .nav-btn{background:transparent;color:var(--muted)}
    .nav-btn:hover,.nav-btn.active{background:var(--surface);color:var(--brand);box-shadow:var(--soft)}
    .primary-btn{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 12px 30px rgba(255,107,53,.28)}
    .secondary-btn{background:var(--surface);color:var(--text);border:1px solid var(--line)}
    .ghost-btn{background:transparent;color:var(--muted)}
    .danger-btn{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
    body.dark .danger-btn{background:#3f1621;color:#fecdd3;border-color:#6b2337}
    .icon-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
    .language-switcher{position:relative}
    .language-trigger{
      width:auto;min-width:76px;height:44px;padding:0 12px;display:flex;align-items:center;justify-content:center;
      gap:8px;border-radius:13px;background:var(--surface);color:var(--text);border:1px solid var(--line);
      font-weight:850;box-shadow:none
    }
    .language-trigger:hover{transform:translateY(-1px);box-shadow:var(--soft)}
    .language-trigger:focus-visible{outline:3px solid rgba(255,107,53,.22);outline-offset:2px}
    .language-trigger .lang-flag{width:24px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:none}
    .language-trigger .lang-flag svg,.language-option .flag svg{width:100%;height:100%;display:block;border-radius:3px;box-shadow:0 0 0 1px rgba(45,27,18,.10)}
    .language-option .flag{width:28px;height:19px;display:inline-flex;align-items:center;justify-content:center}
    .language-trigger .lang-code{font-size:13px;letter-spacing:.04em}
    .language-trigger .lang-chevron{font-size:11px;color:var(--muted);transition:.18s ease}
    .language-switcher.open .lang-chevron{transform:rotate(180deg)}
    .language-menu{
      position:absolute;right:0;top:calc(100% + 10px);width:210px;padding:8px;background:var(--surface);
      border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:2200;
      opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;
      transition:opacity .16s ease,transform .16s ease,visibility .16s ease
    }
    .language-switcher.open .language-menu{opacity:1;visibility:visible;transform:none}
    .language-option{
      width:100%;display:grid;grid-template-columns:28px 1fr 22px;align-items:center;gap:10px;
      padding:11px 12px;border-radius:11px;background:transparent;color:var(--text);text-align:left;font-weight:760
    }
    .language-option:hover,.language-option:focus-visible{background:var(--surface-2);outline:none}
    .language-option small{display:block;color:var(--muted);font-weight:650;margin-top:1px}
    .language-option .check{color:var(--brand);font-weight:950;text-align:right}
    body.dark .language-menu{background:var(--surface)}
    @media(max-width:720px){
      .language-trigger{min-width:52px;padding:0 9px}
      .language-trigger .lang-code{display:none}
      .language-menu{right:-48px}
    }
    .account-btn{display:flex;align-items:center;gap:9px;max-width:220px}
    .avatar-mini{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;flex:none}
    main{max-width:var(--max);margin:auto;padding:32px 18px 120px}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:stretch;margin-bottom:34px}
    .hero-main,.hero-side,.panel,.card,.modal-card,.day-card,.stat-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--soft)}
    .hero-main{padding:52px;border-radius:32px;position:relative;overflow:hidden}
    .hero-main:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-130px;top:-170px;background:rgba(255,183,3,.18);opacity:1}
    body.dark .hero-main:after{background:linear-gradient(135deg,#7c2d12,#431407);opacity:.35}
    .hero-main>*{position:relative;z-index:2}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);color:var(--brand);font-weight:800;padding:8px 12px;border-radius:999px;font-size:14px}
    h1{font-size:clamp(42px,5.6vw,72px);line-height:.98;letter-spacing:-.055em;margin:20px 0 18px}
    h2{font-size:clamp(28px,3vw,38px);line-height:1.05;letter-spacing:-.035em;margin:0}
    h3{margin:0;line-height:1.2}
    .lead{font-size:19px;color:var(--muted);max-width:680px}
    .hero-actions,.toolbar,.button-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .hero-actions{margin-top:26px}
    .hero-actions button{padding:15px 20px}
    .hero-side{border-radius:32px;padding:24px;display:grid;gap:12px}
    .quick-tile{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:13px;padding:16px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:left}
    .quick-tile .qicon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--surface);font-size:23px}
    .quick-tile small{display:block;color:var(--muted);margin-top:2px}
    .section{margin-top:38px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}
    .section-head p{margin:7px 0 0;color:var(--muted)}
    .recipe-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .card{border-radius:var(--radius);overflow:hidden;position:relative;transition:.18s ease}
    .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
    .card-media{aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;cursor:pointer}
    .card-media img{width:100%;height:100%;object-fit:cover}
    .card-body{padding:18px}
    .card-title{font-size:21px;font-weight:900;letter-spacing:-.025em;cursor:pointer}
    .card-desc{color:var(--muted);font-size:14px;margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
    .meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
    .favorite-float{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:var(--soft);font-size:19px}
    .card-actions{display:flex;gap:8px;margin-top:15px}
    .card-actions button{flex:1;padding:10px 12px}
    .filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:18px 0;display:grid;gap:14px}
    .search-row{display:grid;grid-template-columns:2fr repeat(3,minmax(150px,.65fr));gap:10px}
    input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:12px 13px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,107,53,.14)}
    textarea{resize:vertical;min-height:120px}
    label.field{display:grid;gap:6px;font-size:14px;font-weight:720}
    label.field span{color:var(--muted)}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip-btn{padding:9px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-weight:700}
    .chip-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .empty{padding:38px;text-align:center;border:1px dashed var(--line);border-radius:22px;color:var(--muted);background:var(--surface)}
    .detail-shell{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:22px}
    .detail-media{border-radius:28px;overflow:hidden;background:var(--surface-2);min-height:420px}
    .detail-media img{width:100%;height:100%;object-fit:cover}
    .detail-summary{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px}
    .detail-summary h1{font-size:44px;margin:10px 0 14px}
    .detail-desc{color:var(--muted)}
    .detail-columns{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px;margin-top:22px}
    .panel{border-radius:22px;padding:22px}
    .ingredient-list,.step-list,.shopping-list{display:grid;gap:9px;margin-top:14px}
    .ingredient,.step,.shopping-item{padding:12px 13px;border-radius:13px;background:var(--bg);border:1px solid var(--line)}
    .step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
    .step-number{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:850}
    .rating{display:flex;gap:4px}
    .star{background:transparent;padding:3px;font-size:24px}
    .week-grid{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
    .day-card{border-radius:18px;padding:14px;min-width:180px}
    .day-card h3{margin-bottom:10px}
    .slot{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:9px}
    .slot-label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
    .slot-recipe{font-weight:780;margin:5px 0 8px}
    .slot img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin-top:8px}
    .slot select{padding:9px;font-size:13px}
    .shopping-columns{display:grid;grid-template-columns:320px 1fr;gap:18px}
    .shopping-item{display:flex;align-items:center;gap:10px}
    .shopping-item.done{opacity:.52;text-decoration:line-through}
    .shopping-item input{width:auto}
    .roulette-layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
    .roulette-result{min-height:460px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border-radius:28px;background:var(--surface);border:1px solid var(--line)}
    .roulette-result .image{min-height:460px;background:var(--surface-2)}
    .roulette-result img{width:100%;height:100%;object-fit:cover}
    .roulette-copy{padding:34px;display:flex;flex-direction:column;justify-content:center}
    .roulette-copy h2{font-size:42px;margin:10px 0}
    .big-draw{width:100%;padding:17px;font-size:17px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
    .stat-card{border-radius:16px;padding:14px}
    .stat-card strong{font-size:24px;display:block}
    .stat-card span{color:var(--muted);font-size:13px}
    .modal{position:fixed;inset:0;background:rgba(45,27,18,.45);display:grid;place-items:center;z-index:3000;padding:18px}
    .modal-card{width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:24px}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
    .form-stack{display:grid;gap:12px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .avatar-editor{display:flex;align-items:center;gap:16px;padding:14px;background:var(--bg);border-radius:16px}
    .avatar-large{width:82px;height:82px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-size:30px;flex:none}
    .profile-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
    .profile-card .avatar-large{width:96px;height:96px}
    .toast{position:fixed;right:18px;bottom:24px;z-index:5000;background:#2d1b12;color:white;border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}
    .toast.show{opacity:1;transform:none}
    .skeleton{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:18px;min-height:280px}
    @keyframes shimmer{to{background-position:-200% 0}}
    .drawer{position:fixed;inset:0;background:rgba(45,27,18,.45);z-index:2900;display:flex;align-items:flex-end}
    .drawer-body{width:100%;background:var(--surface);border-radius:28px 28px 0 0;padding:24px;max-height:90vh;overflow:auto}
    .cook-step{font-size:clamp(22px,3vw,34px);line-height:1.45;max-width:900px;margin:28px auto;padding:26px;background:var(--bg);border-radius:22px}
    .bottom-nav{display:none}
    .hint{font-size:13px;color:var(--muted)}
    .source-link{word-break:break-all;color:var(--brand);font-weight:700}
    .danger-zone{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
    @media(max-width:1050px){
      .nav-btn span{display:none}.recipe-grid{grid-template-columns:repeat(2,1fr)}
      .hero{grid-template-columns:1fr}.detail-shell{grid-template-columns:1fr}.detail-media{min-height:320px}
      .shopping-columns{grid-template-columns:1fr}.roulette-layout{grid-template-columns:1fr}
    }
    @media(max-width:720px){
      .topbar-inner{padding:9px 12px}.brand span,.nav{display:none}.account-btn .account-label{display:none}
      main{padding:20px 12px 100px}.hero-main{padding:30px 22px;border-radius:24px}.hero-side{border-radius:24px}
      .recipe-grid{grid-template-columns:1fr}.search-row{grid-template-columns:1fr 1fr}.search-row input{grid-column:1/-1}
      .detail-columns,.roulette-result,.form-grid{grid-template-columns:1fr}.roulette-result .image{min-height:260px}
      .detail-summary h1{font-size:36px}.week-grid{grid-template-columns:repeat(7,82vw)}
      .stats{grid-template-columns:1fr 1fr}
      .bottom-nav{display:flex;position:fixed;left:8px;right:8px;bottom:8px;z-index:1500;background:color-mix(in srgb,var(--surface) 95%,transparent);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:var(--shadow);justify-content:space-around}
      .bottom-nav button{background:transparent;color:var(--muted);display:grid;gap:2px;place-items:center;font-size:19px;padding:7px 10px;border-radius:14px}
      .bottom-nav small{font-size:10px}.bottom-nav button.active{background:var(--surface-2);color:var(--brand)}
    }
  </style>

<style>
body:not(.dark) input,
body:not(.dark) select,
body:not(.dark) textarea{background:#fffaf7}

body:not(.dark) .topbar{background:rgba(255,247,237,.92)}
body:not(.dark) .nav-btn:hover,
body:not(.dark) .nav-btn.active{background:#fff0e3}
body:not(.dark) .secondary-btn,
body:not(.dark) .icon-btn{background:#fff7ed}
body:not(.dark) .hero-main,
body:not(.dark) .card,
body:not(.dark) .panel,
body:not(.dark) .modal-card{background:#fffaf5}
</style>

</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <button class="ghost-btn brand" onclick="showHome()" aria-label="Startseite">
        <img src="/static/images/Rezeptroulette.png" alt="">
        <span>Rezeptroulette</span>
      </button>
      <nav class="nav" aria-label="Hauptnavigation">
        <button class="nav-btn active" data-nav="home" onclick="showHome()">⌂ <span>Start</span></button>
        <button class="nav-btn" data-nav="recipes" onclick="loadRecipes()">🍲 <span>Rezepte</span></button>
        <button class="nav-btn" data-nav="roulette" onclick="loadRoulette()">🎲 <span>Roulette</span></button>
        <button class="nav-btn" data-nav="plan" onclick="loadWeeklyPlan()">📅 <span>Plan</span></button>
        <button class="nav-btn" data-nav="list" onclick="loadShoppingList()">🛒 <span>Liste</span></button>
        <button class="nav-btn" data-nav="rescue" onclick="loadFoodRescue()">♻️ <span>Rescue</span></button>
      </nav>
      <button class="secondary-btn account-btn" id="accountButton" onclick="openAccountModal()">
        <span class="avatar-mini" id="headerAvatar">👤</span>
        <span class="account-label">Anmelden</span>
      </button>
      <div class="language-switcher" id="languageSwitcher">
        <button
          class="language-trigger"
          id="languageTrigger"
          type="button"
          onclick="toggleLanguageMenu(event)"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-label="Sprache auswählen">
          <span class="lang-flag" id="currentLanguageFlag"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#ffce00"/><rect width="30" height="13.333" y="0" fill="#dd0000"/><rect width="30" height="6.667" y="0" fill="#000"/></svg></span>
          <span class="lang-code" id="currentLanguageCode">DE</span>
          <span class="lang-chevron">⌄</span>
        </button>
        <div class="language-menu" id="languageMenu" role="menu" aria-label="Sprache">
          <button class="language-option" type="button" role="menuitemradio" data-language="de" onclick="setLanguage('de')">
            <span class="flag"><svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#ffce00"/><rect width="30" height="13.333" y="0" fill="#dd0000"/><rect width="30" height="6.667" y="0" fill="#000"/></svg></span>
            <span><strong>Deutsch</strong><small>German</small></span>
            <span class="check" data-language-check="de"></span>
          </button>
          <button class="language-option" type="button" role="menuitemradio" data-language="en" onclick="setLanguage('en')">
            <span class="flag"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="6"/><path d="M0 0 60 30M60 0 0 30" stroke="#C8102E" stroke-width="2.4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg></span>
            <span><strong>English</strong><small>Englisch</small></span>
            <span class="check" data-language-check="en"></span>
          </button>
        </div>
      </div>
      <button class="icon-btn" onclick="toggleDarkMode()" id="themeButton" aria-label="Darstellung wechseln">🌙</button>
    </div>
  </header>

  <main>
    <section id="homeSection">
      <div class="hero">
        <div class="hero-main">
          <span class="eyebrow">🍽️ Schnell entscheiden. Besser planen.</span>
          <h1>Was darf heute auf den Tisch?</h1>
          <p class="lead">Entdecke passende Rezepte, lass den Zufall entscheiden oder plane deine ganze Woche mit Einkaufsliste.</p>
          <div class="hero-actions">
            <button class="primary-btn" onclick="loadRoulette()">🎲 Rezept ziehen</button>
            <button class="secondary-btn" onclick="loadRecipes()">Rezepte entdecken</button>
          </div>
        </div>
        <div class="hero-side">
          <button class="quick-tile" onclick="loadWeeklyPlan()"><span class="qicon">📅</span><span><strong>Wochenplan</strong><small>Frühstück, Mittag & Abend</small></span><span>→</span></button>
          <button class="quick-tile" onclick="loadShoppingList()"><span class="qicon">🛒</span><span><strong>Einkaufsliste</strong><small>Automatisch aus deinem Plan</small></span><span>→</span></button>

function translateUiText(value){
  if(currentLanguage!=="en") return value;
  const original=String(value??"");
  const trimmed=original.trim();
  if(!trimmed) return original;

  let translated=deToEn.get(trimmed);

  if(!translated){
    const recipeCount=trimmed.match(/^(\d+)\s+Rezepte?\s+gefunden$/);
    if(recipeCount) translated=`${recipeCount[1]} ${recipeCount[1]==="1"?"recipe":"recipes"} found`;
  }
  if(!translated){
    const errorCode=trimmed.match(/^Fehler\s+(\d+)$/);
    if(errorCode) translated=`Error ${errorCode[1]}`;
  }
  if(!translated){
    const minuteValue=trimmed.match(/^(\d+)\s+Min$/);
    if(minuteValue) translated=`${minuteValue[1]} min`;
  }

  if(!translated) return original;
  const leading=original.match(/^\s*/)?.[0]||"";
  const trailing=original.match(/\s*$/)?.[0]||"";
  return leading+translated+trailing;
}

function translateElement(root=document.body){
  if(currentLanguage!=="en"||!root) return;

  const translateAttributes=el=>{
    if(!(el instanceof Element)) return;
    for(const attr of ["placeholder","aria-label","title"]){
      if(el.hasAttribute(attr)){
        const oldValue=el.getAttribute(attr);
        const newValue=translateUiText(oldValue);
        if(newValue!==oldValue) el.setAttribute(attr,newValue);
      }
    }
  };

  if(root.nodeType===Node.TEXT_NODE){
    const p=root.parentElement;
    if(p&&!["SCRIPT","STYLE"].includes(p.tagName)){
      const next=translateUiText(root.nodeValue);
      if(next!==root.nodeValue) root.nodeValue=next;
    }
    return;
  }

  if(root instanceof Element) translateAttributes(root);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
  let node;
  while((node=walker.nextNode())){
    if(node.nodeType===Node.TEXT_NODE){
      const p=node.parentElement;
      if(!p||["SCRIPT","STYLE"].includes(p.tagName)) continue;
      const next=translateUiText(node.nodeValue);
      if(next!==node.nodeValue) node.nodeValue=next;
    }else{
      translateAttributes(node);
    }
  }
}

function updateLanguageSwitcher(){
  const flag=document.getElementById("currentLanguageFlag");
  const code=document.getElementById("currentLanguageCode");
  if(flag) flag.innerHTML=FLAG_SVG[currentLanguage]||FLAG_SVG.de;
  if(code) code.textContent=currentLanguage==="de"?"DE":"EN";

  document.querySelectorAll(".language-option").forEach(btn=>{
    const active=btn.dataset.language===currentLanguage;
    btn.setAttribute("aria-checked",active?"true":"false");
  });
  document.querySelectorAll("[data-language-check]").forEach(el=>{
    el.textContent=el.dataset.languageCheck===currentLanguage?"✓":"";
  });
}

function toggleLanguageMenu(event){
  event?.stopPropagation();
  const switcher=document.getElementById("languageSwitcher");
  const trigger=document.getElementById("languageTrigger");
  if(!switcher||!trigger) return;
  const open=!switcher.classList.contains("open");
  switcher.classList.toggle("open",open);
  trigger.setAttribute("aria-expanded",open?"true":"false");
}

function closeLanguageMenu(){
  const switcher=document.getElementById("languageSwitcher");
  const trigger=document.getElementById("languageTrigger");
  switcher?.classList.remove("open");
  trigger?.setAttribute("aria-expanded","false");
}

function setLanguage(language){
  if(!["de","en"].includes(language)) return;
  localStorage.setItem(UI_LANGUAGE_KEY,language);
  currentLanguage=language;
  document.documentElement.lang=language;
  closeLanguageMenu();
  location.reload();
}

document.addEventListener("click",event=>{
  const switcher=document.getElementById("languageSwitcher");
  if(switcher&&!switcher.contains(event.target)) closeLanguageMenu();
});

document.addEventListener("keydown",event=>{
  if(event.key==="Escape") closeLanguageMenu();
});

const languageObserver=new MutationObserver(mutations=>{
  if(currentLanguage!=="en") return;
  for(const mutation of mutations){
    for(const node of mutation.addedNodes) translateElement(node);
    if(mutation.type==="characterData") translateElement(mutation.target);
  }
});

document.addEventListener("DOMContentLoaded",()=>{
  updateLanguageSwitcher();
  translateElement(document.body);
  languageObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
});

async function requestJson(url,options={}){
  const res=await fetch(url,{...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}});
  let data=null;try{data=await res.json()}catch(_){}
  if(!res.ok)throw new Error(translateUiText(data?.detail||data?.error||`Fehler ${res.status}`));
  return data;
}

}
function weekSlot(day,slot,plan){const id=plan?.[day]?.[slot.id]??plan?.[day]?.[String(slot.id)]??null,r=state.recipes.find(x=>+x.id===+id),options=state.recipes.filter(x=>matchesSlot(x,slot));return `<div class="slot"><div class="slot-label">${slot.name}</div>${r?`<div class="slot-recipe">${escapeHtml(r.name)}</div>${imageUrl(r)?`<img src="${escapeHtml(imageUrl(r))}" alt="">`:""}<div class="button-row" style="margin-top:8px"><button class="ghost-btn" onclick="showRecipe(${+r.id})">Öffnen</button><button class="ghost-btn" onclick="clearDaySlot('${day}',${slot.id})">✕</button></div>`:`<div class="hint" style="margin:5px 0">Noch frei</div>`}<select onchange="if(this.value)setDayRecipeSlot('${day}',${slot.id},this.value)"><option value="">${r?"Ersetzen":"Rezept auswählen"}</option>${options.map(x=>`<option value="${+x.id}">${escapeHtml(x.name)}</option>`).join("")}</select></div>`}
async function setDayRecipeSlot(day,slot,id){try{await requestJson(`/wochenplan/${encodeURIComponent(day)}/${slot}/${+id}`,{method:"POST"});showToast("Eingeplant.");loadWeeklyPlan()}catch(e){showToast(e.message)}}
async function clearDaySlot(day,slot){try{await requestJson(`/wochenplan/${encodeURIComponent(day)}/${slot}/0`,{method:"POST"});loadWeeklyPlan()}catch(e){showToast(e.message)}}
async function autoFillWeek(){const used=new Set(),entries=[];for(const day of DAYS)for(const slot of SLOTS){let pool=state.recipes.filter(r=>matchesSlot(r,slot)&&!used.has(+r.id));if(!pool.length)pool=state.recipes.filter(r=>matchesSlot(r,slot));if(!pool.length)continue;const r=pool[Math.floor(Math.random()*pool.length)];used.add(+r.id);entries.push({day,slot:slot.id,recipe_id:+r.id})}try{await requestJson("/wochenplan/bulk",{method:"POST",body:JSON.stringify({entries})});showToast("Woche geplant.");loadWeeklyPlan()}catch(e){showToast(e.message)}}
async function resetWeek(){if(!confirm("Kompletten Wochenplan leeren?"))return;try{await requestJson("/wochenplan/reset",{method:"POST"});loadWeeklyPlan()}catch(e){showToast(e.message)}}

async function quickAddToPlan(id){
  document.getElementById("planModalContent").innerHTML=`<div class="modal-head"><h2>Rezept einplanen</h2><button class="icon-btn" onclick="closePlanModal()">✕</button></div><form class="form-stack" onsubmit="saveQuickPlan(event,${+id})"><label class="field"><span>Tag</span><select id="quickDay">${DAYS.map(x=>`<option>${x}</option>`).join("")}</select></label><label class="field"><span>Mahlzeit</span><select id="quickSlot">${SLOTS.map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}</select></label><button class="primary-btn" type="submit">Einplanen</button></form>`;document.getElementById("planModal").classList.remove("hidden")
}
function closePlanModal(){document.getElementById("planModal").classList.add("hidden")}
async function saveQuickPlan(e,id){e.preventDefault();try{await requestJson(`/wochenplan/${encodeURIComponent(quickDay.value)}/${+quickSlot.value}/${+id}`,{method:"POST"});closePlanModal();showToast("Eingeplant.")}catch(err){showToast(err.message)}}

function normalizeFoodName(v){return String(v||"").toLowerCase().replace(/[0-9]+([.,][0-9]+)?/g,"").replace(/\b(g|kg|ml|l|el|tl|stück|stk|dose|dosen|packung|päckchen)\b/g,"").replace(/[^\p{L}\s-]/gu," ").replace(/\s+/g," ").trim()}
async function loadShoppingList(){
  setView("list");const c=document.getElementById("content");c.innerHTML=skeleton();try{const d=await requestJson(`/einkaufsliste?t=${Date.now()}`),cats=d.categories||{},atHome=state.atHome.map(normalizeFoodName);const filtered={};for(const [cat,items] of Object.entries(cats)){const rows=items.filter(i=>!atHome.some(h=>h&&normalizeFoodName(i).includes(h)));if(rows.length)filtered[cat]=rows}c.innerHTML=`<div class="section-head"><div><span class="eyebrow">Aus deinem Plan</span><h2 style="margin-top:8px">Einkaufsliste</h2><p>Automatisch aus den geplanten Rezepten zusammengestellt.</p></div><button class="secondary-btn" onclick="copyShoppingList()">Liste kopieren</button></div>
  <div class="shopping-columns"><aside class="panel"><h3>🏠 Habe ich zuhause</h3><p class="hint">Diese Zutaten werden aus der Einkaufsliste ausgeblendet.</p><textarea id="atHomeInput" placeholder="Milch&#10;Eier&#10;Mehl">${escapeHtml(state.atHome.join("\n"))}</textarea><button class="primary-btn" style="width:100%;margin-top:9px" onclick="saveAtHome()">Speichern & neu berechnen</button></aside><div>${Object.keys(filtered).length?Object.entries(filtered).map(([cat,items])=>`<section class="panel" style="margin-bottom:12px"><h3>${escapeHtml(cat)}</h3><div class="shopping-list">${items.map((x,i)=>`<label class="shopping-item"><input type="checkbox" onchange="this.parentElement.classList.toggle('done',this.checked)"><span class="shopping-item-text">${escapeHtml(x)}</span></label>`).join("")}</div></section>`).join(""):`<div class="empty"><h3>Nichts einzukaufen</h3><p>Dein Wochenplan ist leer oder du hast alles bereits zuhause.</p><button class="primary-btn" onclick="loadWeeklyPlan()">Zum Wochenplan</button></div>`}</div></div>`}catch(e){c.innerHTML=`<div class="empty">${escapeHtml(e.message)}</div>`}
}
async function saveAtHome(){state.atHome=atHomeInput.value.split(/\n|,|;/).map(x=>x.trim()).filter(Boolean);if(state.user){try{await requestJson("/at-home",{method:"PUT",body:JSON.stringify({items:state.atHome})})}catch(e){return showToast(e.message)}}else localStorage.setItem("atHomeIngredients",JSON.stringify(state.atHome));showToast("Gespeichert.");loadShoppingList()}
function copyShoppingList(){const items=[...document.querySelectorAll(".shopping-item-text")].map(x=>x.textContent.trim());if(!items.length)return showToast("Keine Zutaten zum Kopieren.");navigator.clipboard?.writeText(items.join("\n")).then(()=>showToast("Einkaufsliste kopiert.")).catch(()=>showToast("Kopieren nicht möglich."))}

async function loadFoodRescue(){
  await ensureRecipes();setView("rescue");document.getElementById("content").innerHTML=`<div class="section-head"><div><span class="eyebrow">Lebensmittel retten</span><h2 style="margin-top:8px">Was hast du noch zuhause?</h2><p>Gib vorhandene Zutaten ein. Wir zeigen Rezepte, die dazu passen.</p></div></div><div class="shopping-columns"><aside class="panel"><textarea id="rescueInput" placeholder="Paprika&#10;Reis&#10;Eier">${escapeHtml(state.pantry.join("\n"))}</textarea><div class="button-row" style="margin-top:10px"><button class="primary-btn" onclick="findRescueRecipes()">Rezepte finden</button><button class="secondary-btn" onclick="savePantry()">Vorrat speichern</button></div></aside><div id="rescueResults"><div class="empty">Gib Zutaten ein, um loszulegen.</div></div></div>`;
}
async function savePantry(){state.pantry=rescueInput.value.split(/\n|,|;/).map(x=>x.trim()).filter(Boolean);if(state.user){try{await requestJson("/pantry",{method:"PUT",body:JSON.stringify({items:state.pantry})})}catch(e){return showToast(e.message)}}else localStorage.setItem("pantry",JSON.stringify(state.pantry));showToast("Vorrat gespeichert.")}
function findRescueRecipes(){const available=rescueInput.value.split(/\n|,|;/).map(normalizeFoodName).filter(Boolean);if(!available.length)return showToast("Bitte Zutaten eingeben.");const scored=state.recipes.map(r=>{const ingredients=(r.zutaten||[]).map(normalizeFoodName),matches=available.filter(a=>ingredients.some(i=>i.includes(a)||a.includes(i)));return{r,score:matches.length,matches}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);rescueResults.innerHTML=scored.length?`<div class="recipe-grid">${scored.slice(0,12).map(x=>recipeCard(x.r)).join("")}</div>`:`<div class="empty"><h3>Keine direkte Übereinstimmung</h3><p>Versuche allgemeinere Begriffe wie „Tomate“, „Reis“ oder „Käse“.</p></div>`}

function showCreateRecipe(){
  document.getElementById("accountModalContent").innerHTML=`<div class="modal-head"><h2>Eigenes Rezept</h2><button class="icon-btn" onclick="closeAccountModal()">✕</button></div><form class="form-stack" onsubmit="createOwnRecipe(event)"><label class="field"><span>Name</span><input id="ownName" required></label><div class="form-grid"><label class="field"><span>Küche</span><input id="ownKitchen" value="Eigene Küche"></label><label class="field"><span>Kochzeit (Min)</span><input id="ownTime" type="number" min="1" value="30"></label></div><label class="field"><span>Kurzbeschreibung</span><textarea id="ownDescription"></textarea></label><label class="field"><span>Zutaten – eine pro Zeile</span><textarea id="ownIngredients" required></textarea></label><label class="field"><span>Zubereitung – ein Schritt pro Zeile</span><textarea id="ownSteps" required></textarea></label><button class="primary-btn" type="submit">Rezept speichern</button></form>`;document.getElementById("accountModal").classList.remove("hidden")
}
async function createOwnRecipe(e){e.preventDefault();const payload={name:ownName.value,kueche:ownKitchen.value,kochzeit:+ownTime.value,portionen:2,schwierigkeit:"Einfach",description:ownDescription.value,tags:["Eigenes Rezept"],zutaten:ownIngredients.value.split("\n").map(x=>x.trim()).filter(Boolean),anleitung:ownSteps.value.split("\n").map((x,i)=>`${i+1}. ${x.trim()}`).filter(Boolean).join("\n")};try{const r=await requestJson("/rezept-erstellen",{method:"POST",body:JSON.stringify(payload)});closeAccountModal();await ensureRecipes(true);showRecipe(r.id);showToast("Rezept gespeichert.")}catch(err){showToast(err.message)}}
async function deleteOwnRecipe(id){if(!confirm("Eigenes Rezept wirklich löschen?"))return;try{await requestJson(`/rezepte/${id}`,{method:"DELETE"});await ensureRecipes(true);loadRecipes();showToast("Rezept gelöscht.")}catch(e){showToast(e.message)}}

function startCookMode(id){const r=state.recipes.find(x=>+x.id===+id);if(!r)return;state.cookSteps=parseSteps(r.anleitung);state.cookIndex=0;document.getElementById("cookTitle").textContent=r.name;document.getElementById("cookDrawer").classList.remove("hidden");updateCookStep()}
function updateCookStep(){document.getElementById("cookStep").innerHTML=state.cookSteps.length?`<div class="hint">Schritt ${state.cookIndex+1} von ${state.cookSteps.length}</div>${escapeHtml(state.cookSteps[state.cookIndex])}`:"Keine Schritte vorhanden."}
function nextCookStep(){if(state.cookIndex<state.cookSteps.length-1){state.cookIndex++;updateCookStep()}else showToast("Fertig – guten Appetit!")}
function previousCookStep(){if(state.cookIndex>0){state.cookIndex--;updateCookStep()}}
function closeCookMode(){document.getElementById("cookDrawer").classList.add("hidden")}
async function shareRecipe(id){const r=state.recipes.find(x=>+x.id===+id),url=`${location.origin}${location.pathname}?recipe=${id}`;try{if(navigator.share)await navigator.share({title:r.name,text:r.description||"",url});else{await navigator.clipboard.writeText(url);showToast("Link kopiert.")}}catch(_){}}

async function toggleDarkMode(){
  document.body.classList.toggle("dark");const theme=document.body.classList.contains("dark")?"dark":"light";localStorage.setItem("theme",theme);document.getElementById("themeButton").textContent=theme==="dark"?"☀️":"🌙";
  if(state.user)try{await requestJson("/preferences",{method:"PUT",body:JSON.stringify({preferences:{theme}})})}catch(_){}
}

async function initializeApp(){
  if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark");
  document.getElementById("themeButton").textContent=document.body.classList.contains("dark")?"☀️":"🌙";
  await initializeAuth();
  await ensureRecipes();
  const params=new URLSearchParams(location.search),recipe=params.get("recipe");
  if(recipe)showRecipe(+recipe);else showHome();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("/static/service-worker.js").catch(()=>{});
}
initializeApp();
</script>
</body>
</html>
